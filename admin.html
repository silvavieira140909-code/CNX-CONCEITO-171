<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNX Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand"><span class="mark">CNX</span><span>PAINEL <b>171</b></span></div><a href="/">← Loja</a></header><main class="admin"><div class="section-head"><div><span class="eyebrow">ADMIN</span><h2>Publicar produto</h2></div></div><form id="form" class="panel"><label>Título<input name="title" required maxlength="120"></label><label>Preço (R$)<input name="price" type="number" step="0.01" min="0" required></label><label>Descrição<textarea name="description" maxlength="500"></textarea></label><label>Arquivo PDF / APK / ZIP etc.<input name="file" type="file" required></label><button class="btn" type="submit">Publicar arquivo</button><p id="msg"></p></form><div class="section-head"><div><span class="eyebrow">CATÁLOGO</span><h2>Gerenciar</h2></div></div><div id="list" class="admin-list"></div></main><script>
const f=document.querySelector('#form'),m=document.querySelector('#msg'),list=document.querySelector('#list');let auth='';
function ask(){auth=btoa(prompt('Usuário:')+':'+prompt('Senha:'));}
async function load(){const r=await fetch('/api/admin/products',{headers:{Authorization:'Basic '+auth}});if(r.status===401){ask();return load()}const d=await r.json();list.innerHTML=d.map(p=>`<div class="admin-row"><span><b>${p.title}</b><small>${p.fileName} • R$ ${p.price.toFixed(2)}</small></span><button onclick="del('${p.id}')">Ocultar</button></div>`).join('')}
f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);m.textContent='Enviando...';const r=await fetch('/api/admin/products',{method:'POST',headers:{Authorization:'Basic '+auth},body:fd});const d=await r.json();m.textContent=d.error||'Publicado!';if(r.ok){f.reset();load()}};
window.del=async id=>{if(confirm('Ocultar este produto?')){await fetch('/api/admin/products/'+id,{method:'DELETE',headers:{Authorization:'Basic '+auth}});load()}};ask();load();
</script></body></html>
