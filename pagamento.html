<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento • CNX</title><link rel="stylesheet" href="/style.css"></head><body><main class="payment"><div class="mark big">CNX</div><span class="eyebrow">CNX CONCEITO 171</span><h1 id="title">Verificando pagamento...</h1><p id="text">Só um instante.</p><div id="downloads"></div><a class="btn" href="/">Voltar para a loja</a></main><script>
const q=new URLSearchParams(location.search),order=q.get('order'),status=q.get('status');const title=document.querySelector('#title'),text=document.querySelector('#text'),dl=document.querySelector('#downloads');
async function run(){if(!order){title.textContent='Pedido não encontrado';return}const r=await fetch('/api/order/'+order);const d=await r.json();if(status==='failure'){title.textContent='Pagamento não concluído';text.textContent='Você pode tentar novamente na loja.';return}if(d.status==='paid'){title.textContent='Pagamento aprovado';text.textContent='Seu acesso está liberado:';dl.innerHTML=d.products.map(p=>`<a class="download" href="/api/download/${d.id}/${p.id}">Baixar ${p.title}</a>`).join('')}else{title.textContent='Pagamento pendente';text.textContent='Se o pagamento acabou de ser aprovado, atualize esta página em alguns segundos.';setTimeout(()=>location.reload(),5000)}}run();
</script></body></html>
